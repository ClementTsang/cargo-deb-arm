# Tests and publishes the image.

name: "Test and publish"

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish-image:
    needs: [test]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
